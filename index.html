<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jn'J Beatz - Carte de Visite Interactive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .card-container {
            perspective: 1000px;
            width: 350px;
            height: 200px;
            margin: 0 auto 40px;
            cursor: pointer;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border-radius: 15px;
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            border-radius: 15px;
        }
        
        .bracelet {
            width: 320px;
            height: 100px;
            background: linear-gradient(to right, #c9b0a6, #a58d85);
            margin: 0 auto 30px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: pulse 2s infinite;
        }
        
        .bracelet:before, .bracelet:after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #d9c7bd;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .bracelet:before {
            left: 15px;
        }
        
        .bracelet:after {
            right: 15px;
        }
        
        .qr-code {
            width: 80px;
            height: 80px;
            background-color: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .qr-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .scan-text {
            color: white;
            margin-top: 15px;
            font-weight: 500;
            font-size: 18px;
        }
        
        .social-section {
            margin-top: 30px;
        }
        
        .social-text {
            color: white;
            margin-bottom: 15px;
            font-style: italic;
            text-align: center;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        .social-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        
        .social-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .social-btn:hover .social-label {
            opacity: 1;
        }
        
        .whatsapp { background: #25D366; }
        .instagram { background: #E1306C; }
        .twitter { background: #1DA1F2; }
        .facebook { background: #4267B2; }
        .tiktok { background: #000000; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 600px) {
            .card-container {
                width: 300px;
                height: 180px;
            }
            
            .bracelet {
                width: 280px;
                height: 90px;
            }
            
            .qr-code {
                width: 70px;
                height: 70px;
            }
            
            .social-links {
                gap: 10px;
            }
            
            .social-text {
                font-size: 0.9em;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const card = document.getElementById('card');
            const cardContainer = document.getElementById('card-container');
            
            // Animation de la carte au chargement
            setTimeout(() => {
                card.classList.add('flipped');
            }, 1000);
            
            // Retournement de la carte au clic
            cardContainer.addEventListener('click', function() {
                card.classList.toggle('flipped');
            });
            
            // Retournement de la carte avec la touche espace
            cardContainer.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.key === 'Enter') {
                    e.preventDefault();
                    card.classList.toggle('flipped');
                }
            });
            
            // Animation automatique toutes les 8 secondes
            setInterval(() => {
                card.classList.toggle('flipped');
            }, 8000);
            
            // Ouvrir les liens sociaux dans un nouvel onglet
            const socialLinks = document.querySelectorAll('.social-links a');
            socialLinks.forEach(link => {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            });
        });
    </script>
