<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jn'J Beatz - Carte de Visite Interactive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jn'J Beatz - Carte de Visite Interactive</h1>
        
        <div class="card-container" id="card-container" aria-label="Carte de visite interactive" title="Cliquez pour retourner la carte" tabindex="0">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <img src="card_front.JPG" alt="Recto de la carte de visite Jn'J Beatz" class="card-img" id="card-front-img">
                </div>
                <div class="card-face card-back">
                    <img src="card_back.JPG" alt="Verso de la carte de visite Jn'J Beatz" class="card-img" id="card-back-img">
                </div>
            </div>
        </div>
        
        <div class="bracelet" aria-label="Bracelet avec QR code interactif">
            <div class="qr-code">
                <canvas id="qrcode-canvas"></canvas>
            </div>
        </div>
        
        <p class="scan-text">Scannez le QR code pour visiter mon site web</p>
        
        <div class="social-section">
            <p class="social-text">Suivez-moi sur les réseaux sociaux pour ne rien manquer !</p>
            <div class="social-links">
                <a href="https://wa.me/50937512414?text=Bonjour%20Jn%E2%80%99J%20Beatz%20Mr%20Gwolo%2C%20je%20viens%20du%20site%20web." class="social-btn whatsapp" aria-label="WhatsApp" title="Lien WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                    <span class="social-label">WhatsApp</span>
                </a>
                <a href="https://www.instagram.com/jnjbeatz" class="social-btn instagram" aria-label="Instagram" title="Lien Instagram">
                    <i class="fab fa-instagram"></i>
                    <span class="social-label">Instagram</span>
                </a>
                <a href="https://x.com/jnjbeatmaker" class="social-btn twitter" aria-label="Twitter" title="Lien Twitter">
                    <i class="fab fa-x-twitter"></i>
                    <span class="social-label">Twitter</span>
                </a>
                <a href="https://facebook.com/jnjbeatzMRGwolo" class="social-btn facebook" aria-label="Facebook" title="Lien Facebook">
                    <i class="fab fa-facebook-f"></i>
                    <span class="social-label">Facebook</span>
                </a>
                <a href="https://www.tiktok.com/jnjbeatz" class="social-btn tiktok" aria-label="TikTok" title="Lien TikTok">
                    <i class="fab fa-tiktok"></i>
                    <span class="social-label">TikTok</span>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
